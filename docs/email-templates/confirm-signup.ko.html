<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>니편내편 이메일 주소 확인</title>
  </head>
  <body style="margin:0;padding:24px;background-color:#f7f7f7;color:#222;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6;">
    <div style="max-width:520px;margin:0 auto;padding:28px;background-color:#fff;border-radius:12px;">
      <h1 style="margin:0 0 20px;font-size:22px;">이메일 주소를 확인해 주세요</h1>
      <p>안녕하세요, 니편내편입니다.</p>
      <p>회원가입을 완료하려면 아래 버튼을 눌러 이메일 주소를 확인해 주세요.</p>
      <p style="margin:28px 0;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;background-color:#ff6b5a;border-radius:8px;color:#fff;text-decoration:none;font-weight:bold;">이메일 주소 확인하기</a>
      </p>
      <p>가입을 요청하지 않았다면 이 메일을 무시해 주세요.</p>
      <p>링크를 사용할 수 없다면 니편내편 가입 화면에서 확인 메일을 다시 요청할 수 있습니다.</p>
      <p style="margin-top:28px;color:#666;font-size:13px;">니편내편</p>
    </div>
  </body>
</html>
